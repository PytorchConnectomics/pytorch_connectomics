[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytorch-connectomics"
version = "2.0.0"
description = "Semantic and instance segmentation toolbox for EM connectomics"
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {text = "MIT"}
authors = [
    {name = "PyTorch Connectomics Contributors"}
]
maintainers = [
    {name = "PyTorch Connectomics Team"}
]
keywords = [
    "connectomics",
    "electron-microscopy",
    "segmentation",
    "deep-learning",
    "pytorch",
    "neuroscience",
    "image-processing",
    "3d-segmentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
]

dependencies = [
    # Deep learning frameworks
    "torch>=1.8.0",
    "torchvision>=0.9.0",
    "numpy>=1.23.0",  # >=1.23 for matplotlib; mahotas 1.4.18+ compatible with numpy 2.x
    # PyTorch Lightning & MONAI (PRIMARY frameworks)
    "pytorch-lightning>=2.0.0",
    "monai>=0.9.1",
    "torchmetrics>=0.11.0",
    # Configuration management
    "omegaconf>=2.1.0",
    # Scientific computing
    "scipy>=1.5",
    "scikit-learn>=0.23.1",
    "scikit-image>=0.17.2",
    # Image processing & I/O
    "opencv-python-headless>=4.3.0",  # headless: no libGL needed on servers
    "h5py>=2.10.0",
    "zarr>=2.10.0",
    "imageio>=2.9.0",
    "nibabel>=3.0.0",
    # Visualization & logging
    "matplotlib>=3.3.0",
    "tensorboard>=2.2.2",
    # Utilities
    "tqdm>=4.58.0",
    "einops>=0.3.0",
    "psutil>=5.8.0",
    "filelock>=3.0.0",
    # Post-processing
    "connected-components-3d>=3.0.0",
    "fastremap>=1.10.0",
    "kimimaro>=1.0.0",
    "crackle-codec>=0.1.0",
    "mahotas>=1.4.0",
    "fastmorph>=1.0.0",
]

[project.optional-dependencies]
cloud = ["cloud-volume"]
viz = ["neuroglancer"]
tune = ["optuna"]
full = [
    "gputil>=1.4.0",
    "nd2>=0.7.0",
    "tifffile>=2021.11.2",
    "wandb>=0.13.0",
    "optuna>=2.10.0",
    "neuroglancer>=1.0.0",
]
dev = [
    "pytest>=6.0.0",
    "pytest-benchmark>=3.4.0",
    "pytest-cov>=3.0.0",
    "ruff",
    "mypy>=0.950",
]
docs = [
    "sphinx>=4.0.0",
    "pytorch-sphinx-theme>=0.0.19",
    "sphinxcontrib-katex",
    "sphinx-rtd-theme>=1.0.0",
    "nbsphinx>=0.8.0",
    "jinja2>=3.0",
]

[project.urls]
Homepage = "https://github.com/PytorchConnectomics/pytorch_connectomics"
Documentation = "https://connectomics.readthedocs.io"
Repository = "https://github.com/PytorchConnectomics/pytorch_connectomics"
"Bug Tracker" = "https://github.com/PytorchConnectomics/pytorch_connectomics/issues"

[project.scripts]
pytc = "connectomics.cli:main"
pytc-download = "connectomics.data.download:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["connectomics*"]
namespaces = false

[tool.setuptools.package-data]
connectomics = ["py.typed", "config/*.yaml", "config/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["connectomics"]

# OmegaConf 2.1 needs typing.List/Dict when inspecting dataclass fields.
[tool.ruff.lint.per-file-ignores]
"connectomics/config/schema/**" = ["UP006", "UP035"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Keep default invocation lightweight; enable coverage locally via CLI when pytest-cov is installed.
addopts = "-v"
markers = [
    "slow: long-running tests",
    "gpu: requires a CUDA-capable GPU",
    "external: requires an explicitly configured external resource",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
