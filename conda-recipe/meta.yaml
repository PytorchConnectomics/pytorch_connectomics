{% set name = "pytorch-connectomics" %}
{% set version = "2.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/PytorchConnectomics/pytorch_connectomics/archive/v{{ version }}.tar.gz
  sha256: # Will be filled in during feedstock creation

build:
  number: 0
  skip: true  # [py<39 or py>=313]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - pytc = connectomics.cli:main
    - pytc-download = connectomics.data.download:main

requirements:
  host:
    - python
    - pip
    - setuptools >=45
    - wheel
  run:
    - python >=3.9,<3.13
    - pytorch >=1.8.0
    - torchvision >=0.9.0
    - numpy >=1.23.0
    - pytorch-lightning >=2.0.0
    - monai >=0.9.1
    - torchmetrics >=0.11.0
    - omegaconf >=2.1.0
    - scipy >=1.5
    - scikit-learn >=0.23.1
    - scikit-image >=0.17.2
    - libopencv * headless*
    - py-opencv >=4.3.0
    - h5py >=2.10.0
    - zarr >=2.10.0
    - imageio >=2.9.0
    - nibabel >=3.0.0
    - matplotlib-base >=3.3.0
    - tensorboard >=2.2.2
    - tqdm >=4.58.0
    - einops >=0.3.0
    - psutil >=5.8.0
    - filelock >=3.0.0
    - connected-components-3d >=3.0.0
    - fastremap >=1.10.0
    - kimimaro >=1.0.0
    - crackle-codec >=0.1.0
    - mahotas >=1.4.0
    - fastmorph >=1.0.0

test:
  imports:
    - connectomics
    - connectomics.config
    - connectomics.data
    - connectomics.training.lightning
    - connectomics.models
    - connectomics.utils
  commands:
    - pytc --help
    - pytc --demo
    - pytc-download --list

about:
  home: https://github.com/PytorchConnectomics/pytorch_connectomics
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Semantic and instance segmentation toolbox for EM connectomics
  description: |
    PyTorch Connectomics is a modern deep learning framework for automatic
    and semi-automatic semantic and instance segmentation in connectomics.
    Built on PyTorch Lightning and MONAI, it provides a scalable, flexible,
    and easy-to-use platform for electron microscopy image analysis.
  doc_url: https://connectomics.readthedocs.io
  dev_url: https://github.com/PytorchConnectomics/pytorch_connectomics

extra:
  recipe-maintainers:
    - zudi-lin
