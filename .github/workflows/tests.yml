name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: ubuntu-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov
          python -m pip install -e .
      - name: Validate tutorial configs
        run: python scripts/validate_tutorial_configs.py --glob 'tutorials/*.yaml' --glob 'tutorials/**/*.yaml'
      - name: Run tests
        run: python -m pytest tests/ -v --cov=connectomics --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}

  packaging:
    uses: ./.github/workflows/packaging.yml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install linters
        run: python -m pip install ruff mypy
      - name: Check changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          base = os.environ['BASE_SHA'] if os.environ['EVENT_NAME'] == 'pull_request' else os.environ['BEFORE_SHA']
          if not base or set(base) == {'0'}:
              base = subprocess.check_output(['git', 'hash-object', '-t', 'tree', '/dev/null'], text=True).strip()
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT', base, 'HEAD', '--', 'connectomics/', 'tests/', 'scripts/'],
              text=True,
          )
          files = [path for path in changed.splitlines() if path.endswith('.py')]
          if files:
              subprocess.check_call(['ruff', 'check', *files])
              subprocess.check_call(['ruff', 'format', '--check', *files])
              subprocess.check_call(['mypy', '--config-file', '.github/mypy_changed.ini', *files])
          else:
              print('No changed Python files under connectomics/, tests/, or scripts/.')
          PY
