name: Packaging

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Verify wheel data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path('dist').glob('*.whl')
          with ZipFile(wheel) as archive:
              contents = set(archive.namelist())
              expected = {'connectomics/py.typed', 'connectomics/config/demo/minimal.yaml'}
              expected.update(str(path) for path in Path('connectomics/config').rglob('*.yaml'))
              assert expected <= contents, sorted(expected - contents)
              print('\n'.join(sorted(expected)))
          PY
      - name: Install wheel in an isolated environment
        shell: bash
        run: |
          package_venv="$RUNNER_TEMP/pytc-wheel-venv"
          python -m venv "$package_venv"
          "$package_venv/bin/python" -m pip install dist/*.whl --extra-index-url https://download.pytorch.org/whl/cpu
          expected_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          cd "$RUNNER_TEMP"
          "$package_venv/bin/python" -c 'import connectomics, sys; assert connectomics.__file__.startswith(sys.prefix), connectomics.__file__; assert connectomics.__version__ == sys.argv[1]; print(connectomics.__version__)' "$expected_version"
          "$package_venv/bin/pytc" --help
          "$package_venv/bin/pytc-download" --list
          "$package_venv/bin/pytc" --demo
          "$package_venv/bin/python" -m pip check
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
