name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    uses: ./.github/workflows/packaging.yml

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match release tag to package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag_version = os.environ['RELEASE_TAG'].removeprefix('v')
          assert tag_version == version, f'{tag_version} != {version}'
          PY

  publish:
    name: Publish verified distributions to PyPI
    needs: [verify, check-version]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pytorch-connectomics
    permissions:
      id-token: write
    steps:
      - name: Download this run's verified distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
