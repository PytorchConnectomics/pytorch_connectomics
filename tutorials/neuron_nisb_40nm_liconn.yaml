shared:
  arch_profile: mednext_b

_base_: neuron_nisb_40nm_common.yaml

experiment_name: neuron_nisb_40nm_exm_mednext_b_sdt
description: NISB ExM neuron instance segmentation (BANIS-style) with MedNeXt-B, affinity + SDT (40nm)

data:
  train_path: /projects/weilab/dataset/nisb/exm/train
  val_path: /projects/weilab/dataset/nisb/exm/val

  label_transform:
    targets:
      - name: affinity
        kwargs:
          long_range: 3
      - name: skeleton_aware_edt
        kwargs:
          resolution: [36, 36, 24]
          alpha: 0.8
          bg_value: -1.0
          relabel: true
monitor:
  checkpoint:
    dirpath: outputs/neuron_nisb_40nm_exm_mednext_b_sdt/checkpoints/

test:
  data:
    test_path: /projects/weilab/dataset/nisb/exm/test/    
    output_path: outputs/neuron_nisb_40nm_exm_mednext_b_sdt/results_seed101/

train:
  system:
    overrides:
      batch_size: 4
