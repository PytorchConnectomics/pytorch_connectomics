# BANIS+ on four low-res volumes (MICrONS phase 1, minnie65, minnie35, H01; 256 nm pixels,
# 264-320 nm sections), no label erosion, affinities at 1 and 5 voxels.
#
#   data:   python tutorials/neuron_seg256nm/prepare_data.py clahe ...   (minnie65, minnie35 images)
#           python tutorials/neuron_seg256nm/prepare_data.py cubes ...   (once per volume)
#   train:  python scripts/main.py --config tutorials/neuron_seg256nm/banis+_e0_aff1-5.yaml
#   infer:  python scripts/main.py --config tutorials/neuron_seg256nm/banis+_e0_aff1-5.yaml --mode test \
#               --checkpoint <run>/checkpoints/last.ckpt
#
# Recipe = banis+.yaml in this folder (MedNeXt-S/k3, 128 cube, ABISS-layout 6-channel affinity,
# class-balanced BCE, EMA, aug_light, the MedNeXt speed knobs) with these changes:
#
# LABELS -- erosion 0: the affinity target is computed from the labels as they are, so a
# boundary is one voxel-pair wide (erosion 1 in banis+.yaml removes 256-320 nm per side).
#
# AFFINITY -- offsets 1 and 5 voxels on every axis (banis+.yaml: 1 and 10). Channels are
# x, y, z at 1 voxel, then x, y, z at 5 voxels, edge (i-k, i) stored at voxel i. Destination
# storage needs the voxel at i - 5, so target_context reads 5 voxels on the leading side.
#
# DATA -- 256^3 cubes written by prepare_data.py: per volume, the quarter-point cubes
# (`<volume>_q?`) train and the centre cube (`<volume>_ctr`) validates. The minnie65 and
# minnie35 images are contrast-equalised once on disk (prepare_data.py clahe); phase 1 and
# H01 were equalised at the source. Nothing is equalised on the fly.

_base_:
- banis+.yaml

experiment_name: seg256nm_banis+_e0_aff1-5
description: >-
  BANIS+ (MedNeXt-S/k3, 6-channel ABISS-layout affinity at 1 and 5 voxels, class-balanced BCE,
  EMA, erosion 0) on 256^3 cubes of MICrONS phase 1, minnie65, minnie35 and H01 at 256 nm.

default:
  data:
    dataloader:
      target_context: [5, 5, 5, 0, 0, 0]
    label_transform:
      erosion: 0
      targets:
      - name: affinity
        kwargs:
          offsets: ["0-0-1", "0-1-0", "1-0-0", "0-0-5", "0-5-0", "5-0-0"]
          affinity_mode: deepem

train:
  data:
    train:
      path: /path/to/seg256nm/cubes
      image: "*_q?_img.h5"
      label: "*_q?_seg.h5"
    val:
      path: /path/to/seg256nm/cubes
      image: "*_ctr_img.h5"
      label: "*_ctr_seg.h5"

test:
  data:
    test:
      path: /path/to/seg256nm/cubes
      image: "*_ctr_img.h5"
      label: "*_ctr_seg.h5"
